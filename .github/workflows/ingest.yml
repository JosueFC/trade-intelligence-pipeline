name: monthly-ingest
on:
  schedule:
    - cron: "17 9 12 * *"      # 12th of each month; Census publishes with a lag
  workflow_dispatch: {}
jobs:
  ingest:
    runs-on: ubuntu-latest
    env:
      CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
      DBT_SEND_ANONYMOUS_USAGE_STATS: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Restore database from last run
        uses: actions/cache/restore@v4
        with:
          path: data/trade.duckdb
          key: trade-db-${{ github.run_id }}
          restore-keys: trade-db-
      - name: Backfill if first run, otherwise incremental
        run: |
          if [ -f data/trade.duckdb ]; then
            python -m ingest.census_imports --since-last
          else
            python -m ingest.census_imports --start 2023-01
          fi
      - run: cd dbt && dbt build --profiles-dir .
      - name: Save database for next run
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data/trade.duckdb
          key: trade-db-${{ github.run_id }}
